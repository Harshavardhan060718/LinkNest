<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="createaccount.css">
</head>

<body>
    <div class="signup-container">
        <h2 style="color: #ff5733;">Create Account</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button style="background-color: #C53675;" type="submit" onclick="window.location.href='../mainpage/sortdata.html'">Sign Up</button>
        </form>
        <p>Already have an account?<a href="login.html" style="color: #C53675;">Sign in</a></p>
    </div>

    <script src="signup.js"></script>
</body>

</html>
